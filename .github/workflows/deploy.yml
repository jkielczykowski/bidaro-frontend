name: Deploy

# Web app pipeline (FluffyTag-style; secrets in .github/SECRETS.md). Every push to master:
# build + lint → full E2E suite from bidaro-backend against THIS web build → deploy → smoke.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BIDIGO_URL: ${{ vars.BIDIGO_URL || 'http://72.61.177.37:9088' }}
  BACKEND_REPO: jkielczykowski/bidaro-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, build
        run: |
          npx tsc -b
          npm run lint
          npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout web app
        uses: actions/checkout@v4
        with:
          path: frontend

      # The E2E suite, migrations and local stack live in the (private) backend repo;
      # read through a read-only deploy key of bidaro-backend (scripts/backend-deploy-key.sh)
      - name: Checkout bidaro-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend/e2e

      - name: Install Playwright browsers
        working-directory: backend/e2e
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase and load migrations
        working-directory: backend/e2e
        run: |
          npm run db:start
          node scripts/db-load.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start local OpenSearch + bidigo-search
        working-directory: backend/e2e
        run: npm run search:start

      - name: Start bidaro-api (Java) against the local stack
        working-directory: backend/e2e
        run: npm run api:start

      - name: Run E2E tests against this web build
        working-directory: backend/e2e
        env:
          CI: true
          FRONTEND_DIR: ${{ github.workspace }}/frontend
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/e2e/report/
          retention-days: 7

  deploy:
    needs: e2e
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bidaro-deploy
          chmod 600 ~/.ssh/bidaro-deploy

      - name: Deploy web app to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '72.61.177.37' }}
          VPS_USER: ${{ secrets.VPS_USERNAME || 'root' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: SSH_KEY="$HOME/.ssh/bidaro-deploy" bash deploy/deploy.sh

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smoke/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix smoke

      - name: Install Playwright browsers
        working-directory: smoke
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against the deployed site
        working-directory: smoke
        env:
          CI: true
          SMOKE_BASE_URL: ${{ env.BIDIGO_URL }}
        run: npm test

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: smoke/report/
          retention-days: 7
