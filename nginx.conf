# http-level settings (this file is included inside nginx's http block)

# Search API micro-cache: identical GETs within a few seconds hit OpenSearch once
proxy_cache_path /var/cache/nginx/search levels=1:2 keys_zone=search_cache:10m max_size=100m inactive=10m use_temp_path=off;
# Per-client request limit for the search API (protects OpenSearch from floods)
limit_req_zone $binary_remote_addr zone=search_rl:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (the JS bundle is ~650 KB raw, ~190 KB gzipped)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Docker DNS: re-resolve bidigo-search, which bidaro-backend redeploys independently
    resolver 127.0.0.11 valid=10s ipv6=off;

    # OpenSearch API (bidigo-search on apps-net, deployed by bidaro-backend)
    location /api/search/ {
        limit_req zone=search_rl burst=40 nodelay;
        limit_req_status 429;

        proxy_cache search_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        set $search_upstream http://bidigo-search:3000;
        rewrite ^/api/search/(.*)$ /$1 break;
        proxy_pass $search_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed build files never change under the same name
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicons / brand marks: short cache so logo updates show up
    location ~* ^/(favicon|apple-touch-icon) {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
