server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: re-resolve bidigo-search, which bidaro-backend redeploys independently
    resolver 127.0.0.11 valid=10s ipv6=off;

    # OpenSearch API (bidigo-search on apps-net, deployed by bidaro-backend)
    location /api/search/ {
        set $search_upstream http://bidigo-search:3000;
        rewrite ^/api/search/(.*)$ /$1 break;
        proxy_pass $search_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Favicons / brand marks: short cache so logo updates show up
    location ~* ^/(favicon|apple-touch-icon) {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
